    <script>
        document.querySelectorAll(".gallery-item img").forEach(image => {
            let tapped = false; // Track first tap
        
            image.addEventListener("click", function (event) {
                if (!tapped) {
                    // First tap: Zoom in, prevent modal
                    event.preventDefault(); // Stop the modal from opening
                    document.querySelectorAll(".gallery-item img").forEach(img => img.classList.remove("active"));
                    this.classList.add("active");
                    tapped = true;
        
                    // Reset tap state after 400ms (prevents immediate modal open)
                    setTimeout(() => {
                        tapped = false;
                    }, 400);
                } else {
                    // Second tap: Remove zoom & allow modal to open
                    this.classList.remove("active");
                }
            });
        });
        
    </script>
