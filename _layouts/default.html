<!DOCTYPE html>
<html lang="en">
  <head>
{%- include head.html %}
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
{%- if page.wrapper == 'hero' %}
    <div class="background-container" id="hero-bg">
{%- elsif page.wrapper == 'alt' %}
    <div class="background-container-2">
{%- endif %}
{%- include nav.html %}
{{ content }}
{%- if page.wrapper %}
    </div>
{%- endif %}
{%- include footer.html %}
    <script src="{{ '/js/dropdown.js' | relative_url }}"></script>
    <script src="{{ '/js/body-fade-in.js' | relative_url }}"></script>
{%- for s in page.extra_js %}
    <script src="{{ s | relative_url }}"></script>
{%- endfor %}
{%- if page.wrapper == 'hero' %}
    <script>
      // A fresh random hero on every page load. The list is generated from
      // whatever is in /images/hero/, so adding one is a file drop.
      document.addEventListener("DOMContentLoaded", function () {
        const heroImages = [
{%- for img in site.static_files -%}
{%- if img.path contains '/images/hero/' %}
          "{{ img.path | relative_url }}",
{%- endif -%}
{%- endfor %}
        ];
        const hero = document.getElementById("hero-bg");
        if (hero && heroImages.length) {
          hero.style.backgroundImage =
            `url(${heroImages[Math.floor(Math.random() * heroImages.length)]})`;
        }
      });
    </script>
{%- endif %}
  </body>
</html>
